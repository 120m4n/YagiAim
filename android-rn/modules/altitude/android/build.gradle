plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.meshaltitude'
version = '1.0.0'

android {
  namespace "expo.modules.meshaltitude"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "androidx.core:core:1.13.1"
  implementation "androidx.core:core-location-altitude:1.0.0"
}
