name: android-rn
on:
  pull_request:
    paths: ['android-rn/**', 'MeshAzimuthTests/Fixtures/**', 'specs/004-react-native-android/**']
  push:
    branches: [main, '004-react-native-android']
    paths: ['android-rn/**', 'MeshAzimuthTests/Fixtures/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-rn } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: android-rn/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  build:
    runs-on: ubuntu-latest
    needs: test
    defaults: { run: { working-directory: android-rn } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: android-rn/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease
        working-directory: android-rn/android
