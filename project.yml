name: YagiAim
options:
  bundleIdPrefix: co.electrosoftware
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  YagiAim:
    type: application
    platform: iOS
    sources: [YagiAim]
    info:
      path: YagiAim/Info.plist
      properties:
        CFBundleDisplayName: MeshAzimuth
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIRequiredDeviceCapabilities: [magnetometer, location-services, gps]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: >-
          MeshAzimuth usa tu ubicación para calcular el azimut y la distancia
          hacia el repetidor MeshCore.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.electrosoftware.yagiaim
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  YagiAimTests:
    type: bundle.unit-test
    platform: iOS
    sources: [YagiAimTests]
    dependencies:
      - target: YagiAim
