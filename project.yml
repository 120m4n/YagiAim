name: MeshAzimuth
options:
  bundleIdPrefix: co.electrosoftware
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MeshAzimuth:
    type: application
    platform: iOS
    sources: [MeshAzimuth]
    info:
      path: MeshAzimuth/Info.plist
      properties:
        CFBundleDisplayName: MeshAzimuth
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIRequiredDeviceCapabilities: [magnetometer, location-services, gps]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: >-
          MeshAzimuth usa tu ubicación para calcular el azimut y la distancia
          hacia el repetidor MeshCore.
        NSBluetoothAlwaysUsageDescription: >-
          MeshAzimuth se conecta al pinger LoRa para medir la calidad del
          enlace con el repetidor.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.electrosoftware.meshazimuth
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MeshAzimuthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeshAzimuthTests
        excludes: ["Fixtures/**"]
      # Copia de los fixtures de líneas del pinger (tools/sync_fixtures.sh), como carpeta de recursos:
      # el bundle de tests contiene `lines/` (spec 003, research R-8).
      - path: MeshAzimuthTests/Fixtures/lines
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES   # sin esto Xcode no puede firmar el bundle de tests
    dependencies:
      - target: MeshAzimuth
schemes:
  MeshAzimuth:
    build:
      targets:
        MeshAzimuth: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MeshAzimuthTests]
